name: constant_device_id
description: >
  A Flutter plugin that provides a permanent device identifier that persists
  across app reinstalls. Uses Widevine DRM on Android and the system Keychain
  on iOS for hardware-level persistence.
version: 0.1.1
homepage: https://github.com/your-org/constant_device_id
repository: https://github.com/your-org/constant_device_id
issue_tracker: https://github.com/your-org/constant_device_id/issues

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.7
  flutter_secure_storage: ^11.2.0
  plugin_platform_interface: ^2.1.8
  shared_preferences: ^2.5.5
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.constant_device_id
        pluginClass: ConstantDeviceIdPlugin
      ios:
        pluginClass: ConstantDeviceIdPlugin
